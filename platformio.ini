; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; HomeSpan 需 Arduino-ESP32 >= 3.3.0；platform 8.x 帶 3.3.12
platform = espressif32 @ ~8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

; demo / fan_* 工具不當預設編譯；HomeKit 以 main.cpp 為主
build_src_filter = +<*> -<demo.cpp> -<fan_off.cpp> -<fan_scan.cpp> -<fan_mode_test.cpp>

lib_deps =
  HomeSpan/HomeSpan
  4-20ma/ModbusMaster

; 純 RS485 關機（無 HomeKit）
[env:fan_off]
platform = espressif32 @ ~8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<fan_off.cpp>
lib_deps =
  4-20ma/ModbusMaster

; Modbus 位址掃描（無 HomeKit）
[env:fan_scan]
platform = espressif32 @ ~8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<fan_scan.cpp>

; 全模式輪詢測試（無 HomeKit）
[env:fan_mode_test]
platform = espressif32 @ ~8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<fan_mode_test.cpp>
